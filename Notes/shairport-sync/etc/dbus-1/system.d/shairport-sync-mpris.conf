<!-- Updated version supporting modern MPRIS standards and legacy interfaces -->
<!DOCTYPE busconfig PUBLIC
          "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
          "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- Allow users "root" and "shairport-sync" to own all naming variations -->
  <policy user="shairport-sync">
    <allow own="org.mpris.MediaPlayer2.shairport-sync"/>
    <allow own="org.mpris.MediaPlayer2.shairport-sync.*"/>
    <allow own="org.mpris.MediaPlayer2.ShairportSync"/>
    <allow own="org.gnome.ShairportSync"/>
    <allow own="org.gnome.ShairportSync.*"/>
  </policy>

  <policy user="root">
    <allow own="org.mpris.MediaPlayer2.shairport-sync"/>
    <allow own="org.mpris.MediaPlayer2.shairport-sync.*"/>
    <allow own="org.mpris.MediaPlayer2.ShairportSync"/>
    <allow own="org.gnome.ShairportSync"/>
    <allow own="org.gnome.ShairportSync.*"/>
  </policy>

  <!-- Allow anyone to invoke methods or receive signals from these servers -->
  <policy context="default">
    <allow send_destination="org.mpris.MediaPlayer2.shairport-sync"/>
    <allow receive_sender="org.mpris.MediaPlayer2.shairport-sync"/>
    <allow send_destination="org.mpris.MediaPlayer2.ShairportSync"/>
    <allow receive_sender="org.mpris.MediaPlayer2.ShairportSync"/>
    <allow send_destination="org.gnome.ShairportSync"/>
    <allow receive_sender="org.gnome.ShairportSync"/>
  </policy>

</busconfig>
