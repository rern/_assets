<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- Allow root and shairport-sync users to own modern and legacy interfaces -->
  <policy user="root">
    <allow own="org.mpris.MediaPlayer2.shairport-sync"/>
    <allow own="org.mpris.MediaPlayer2.shairport-sync.*"/>
    <allow own="org.gnome.ShairportSync"/>
    <allow own="org.gnome.ShairportSync.*"/>
  </policy>

  <policy user="shairport-sync">
    <allow own="org.mpris.MediaPlayer2.shairport-sync"/>
    <allow own="org.mpris.MediaPlayer2.shairport-sync.*"/>
    <allow own="org.gnome.ShairportSync"/>
    <allow own="org.gnome.ShairportSync.*"/>
  </policy>

  <!-- Allow anyone to send/receive data to/from either interface -->
  <policy context="default">
    <allow send_destination="org.mpris.MediaPlayer2.shairport-sync"/>
    <allow receive_sender="org.mpris.MediaPlayer2.shairport-sync"/>
    <allow send_destination="org.gnome.ShairportSync"/>
    <allow receive_sender="org.gnome.ShairportSync"/>
  </policy>

</busconfig>
